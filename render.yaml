services:
  - type: web
    name: app-clinicas-backend
    runtime: node
    rootDir: backend
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://tecbmclinicas.netlify.app
      - key: UPLOADS_DIR
        value: /var/data/uploads
      # Connection string do Postgres (Supabase, Session pooler) — configurada
      # manualmente no painel do Render, não fica no blueprint (é segredo).
      # O banco em si não usa mais o disco persistente (só uploads continuam nele).
      - key: DATABASE_URL
        sync: false
    disk:
      name: dados-persistentes
      mountPath: /var/data
      sizeGB: 1
